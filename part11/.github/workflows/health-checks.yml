name: Health checks

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      service-url:
        description: the url that shall be used for the health check
        required: true
        default: http://localhost
        type: string

jobs:
  health-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          url: ${{ inputs.service-url }}
          follow-redirect: false
          max-attempts: 3
          retry-delay: 5s
          retry-all: false